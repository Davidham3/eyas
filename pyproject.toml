[project]
name = "eyas"
version = "0.1.0"
description = "Train sharp-eyed prompts for multimodal models. A performance-first APO (automatic prompt optimization) framework for text, image and video tasks."
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ChaoSong", email = "davidchaosong@outlook.com" }]
readme = "README.md"
keywords = [
    "prompt-optimization",
    "automatic-prompt-optimization",
    "multimodal",
    "vision-language-models",
    "video-understanding",
    "llm",
    "evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Davidham3/eyas"
Repository = "https://github.com/Davidham3/eyas"
Documentation = "https://Davidham3.github.io/eyas/"

[project.optional-dependencies]
# One extra per inference-backend shape; the engine extra (vllm) is heavy, api is
# light and composable
vllm = [
    # vLLM is the primary in-process route. The qwen3_5 architecture needs
    # vllm>=0.29 (0.8.x is the
    # Qwen2.5-VL era, without this model implementation); the 0.29.x line carries it.
    # transformers/torch are not pinned — vllm 0.29 carries the exact
    # constraints transformers>=5.10.4 and torch==2.13.0 (qwen3_5 loading/processing
    # verified against that combination); torch resolves from PyPI
    "vllm>=0.29.0,<0.30",
]
api = [
    "httpx>=0.27",
    # prefetch.py materializes images with PIL (MediaPrefetchLoader is shared by
    # all backends; the GPU extra got pillow transitively from vllm — the
    # api extra must carry it explicitly, or prefetch raises
    # ModuleNotFoundError: No module named 'PIL')
    "pillow>=10",
]
prepare = [
    # eyas prepare: quickstart dataset download/convert (eyas.prepare). The reader
    # stack stays out of the runtime deps on purpose (it is heavy and only needed
    # once per dataset); modelscope is an opt-in per-run --with for
    # --source modelscope.
    "datasets>=4",
    "pyarrow>=17",
    "pillow>=10",
]

[dependency-groups]
dev = [
    # self-reference: the fast suite's third-party needs (httpx MockTransport in
    # test_backends_openai / configs, PIL in prefetch / vllm image-payload tests)
    # ARE the api extra's surface — declare once there, inherit here
    "eyas[api]",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.16.6",
]
docs = [
    "sphinx>=8.0",
    "myst-nb>=1.1",
    "sphinx-book-theme>=1.1",
    "sphinx-copybutton>=0.5",
]

[project.scripts]
eyas = "eyas.cli:main"

# Packaged third-party plugins register through this entry-points group
# (consumed by eyas.registry._load_plugins on first registry access). The framework
# itself ships no plugin here — example only; see examples/plugin_backend/README.md.
[project.entry-points."eyas.plugins"]
# my_plugins = "my_pkg.eyas_plugins" # a module whose import performs the registration

[tool.uv]
# PyPI is the single declared index — reproducible and location-neutral. Developers on
# mirrored networks keep per-machine acceleration out of the repo in a gitignored
# uv.toml / environment variables (UV_DEFAULT_INDEX, UV_PYTHON_INSTALL_MIRROR).

# flash-attn is not brought in: the PyPI wheel of the vllm extra's former torch 2.6.0
# base used the old CXX11 ABI, while prebuilt wheels on the cxx11abiFALSE tags actually
# require new-ABI
# symbols (undefined symbol on load); vllm ships its own vllm_flash_attn and does not
# depend on it

[build-system]
requires = ["uv_build>=0.7,<1.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]  # examples/ carries the skeleton's mock contract tests (CI-gateable)
pythonpath = ["."]  # repo-root-relative imports (plugins-key modules resolve relative to the CWD)
addopts = "-m 'not slow'"
markers = [
    "slow: tests that need a GPU / real engines (nightly)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# I = import sorting from the isort lineage; formatting goes through ruff format (replaces black)
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
# whole-module registration files: every import is a side effect; "unused" does
# not apply. (Incidental registration imports inside ordinary modules keep the
# line-level `# noqa: F401` — the exemption follows the file's purpose.)
"src/eyas/builtin.py" = ["F401"]
"src/eyas/engine/builtin.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
# cache_dir intentionally unset: mypy defaults to the repo-local .mypy_cache/ (gitignored).
# Developers on slow shared filesystems can redirect it per-machine via the
# MYPY_CACHE_DIR environment variable.

[[tool.mypy.overrides]]
module = "eyas.prepare"
# The quickstart data-prep pipeline was vendored from a standalone script (heavy
# IO + untyped third-party reader deps). Its zero-network conversion/sampling
# contract is pinned by tests/test_prepare_quickstart.py; a full annotation pass
# is a scheduled follow-up, not part of the engine's typed surface.
ignore_errors = true

[tool.coverage.run]
source = ["src/eyas"]
