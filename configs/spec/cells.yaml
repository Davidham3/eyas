# Per-cell exceptions (dotted-path overrides over the assembled
# defaults+dataset+method layers; the delete marker is null) and the openai
# variant: its definition, the availability list (which cells ship a mirror),
# and per-cell mirror exceptions.
cells:
  pets/protegi:
    why: 'quickstart toy split n=74: the bandit selector pins samples_per_eval=9 = floor(74/8) so
      all 8 configured pulls serve real windows (eval_rounds stays 8 — paper structure).'
    set:
      budget.params.samples_per_eval: 9
