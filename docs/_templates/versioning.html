{% if versions %}
<div class="version-switcher">
  <label for="version-select">Version</label>
  <select id="version-select" onchange="if (this.value) window.location.href = this.value;">
    {% for item in versions.branches %}
    <option value="{{ item.url }}"{% if current_version and item.name == current_version.name %} selected{% endif %}>latest ({{ item.name }})</option>
    {% endfor %}
    {% for item in versions.releases | sort(attribute='name', reverse=true) %}
    <option value="{{ item.url }}"{% if current_version and item.name == current_version.name %} selected{% endif %}>{{ item.name }}</option>
    {% endfor %}
  </select>
</div>
{% endif %}
