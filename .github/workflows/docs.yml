name: docs

# Deploy the Sphinx (MyST-NB) site to GitHub Pages on every main push that
# touches the docs tree (conf.py lives inside it). Link/toctree integrity is
# gated by the ci workflow (tests/docs/test_docs_links.py + sphinx-build -W); this
# workflow only publishes. Notebook execution is off — the build needs no GPU.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.21"  # pinned for reproducibility (matches the local uv that produced uv.lock)
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync with docs group
        run: uv sync --group docs

      - name: sphinx-build (HTML)
        run: uv run sphinx-build -b html docs site

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  # The shape deploy-pages expects: the artifact is uploaded by `build`, and
  # `deploy` starts only after that job completes. Same-job deploys queried the
  # artifact API milliseconds after the upload finalized and hit GitHub's
  # eventual consistency ("No artifacts named github-pages were found").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1